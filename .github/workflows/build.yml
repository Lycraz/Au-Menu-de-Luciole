# Fabrique automatiquement l'app iPhone (.ipa pour SideStore) et l'app Android (.apk)
# à chaque modification du code, puis publie une nouvelle version.
name: Construire et publier

on:
  push:
    branches: [main]
    paths-ignore:
      - "sidestore/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

env:
  VERSION: 1.0.${{ github.run_number }}
  BUILD: ${{ github.run_number }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dépendances
        run: |
          npm install
          npm run setup
      - run: npm test
      - name: Vérification des types
        run: npm run typecheck
        continue-on-error: true

  ios:
    name: App iPhone
    needs: tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dépendances
        run: |
          npm install
          npm run setup

      - name: Générer le projet iOS
        run: |
          node scripts/set_version.js "$VERSION" "$BUILD"
          npx expo prebuild --platform ios --clean

      - name: Compiler (sans signature, SideStore signe l'app sur l'iPhone)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          ls -d build/Build/Products/Release-iphoneos/*.app

      - name: Créer le fichier .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry AuMenuDeLuciole.ipa Payload
          ls -lh AuMenuDeLuciole.ipa

      - name: Erreurs de compilation (en cas d'échec)
        if: failure()
        run: |
          grep -E "error:|Error:|fatal" xcodebuild.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error title=iPhone::${line}"
          done || true
          tail -80 xcodebuild.log | sed 's/^/  /' || true

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: AuMenuDeLuciole.ipa

  android:
    name: App Android
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant (voir le README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Dépendances
        run: |
          npm install
          npm run setup

      - name: Générer le projet Android
        run: |
          node scripts/set_version.js "$VERSION" "$BUILD"
          npx expo prebuild --platform android --clean

      - name: Compiler
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../AuMenuDeLuciole.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: AuMenuDeLuciole.apk

  publier:
    name: Publier la version
    needs: [ios, android]
    if: ${{ always() && (needs.ios.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Créer la version sur GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          NOTES="$(git log -1 --pretty=%B)"
          gh release create "v$VERSION" dist/* --title "Au Menu de Luciole $VERSION" --notes "$NOTES"

      - name: Mettre à jour la source SideStore
        if: ${{ needs.ios.result == 'success' }}
        run: |
          python3 scripts/update_source.py \
            --ipa dist/AuMenuDeLuciole.ipa \
            --version "$VERSION" --build "$BUILD" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "$(git log -1 --pretty=%B)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore/source.json
          git commit -m "SideStore : version $VERSION" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
